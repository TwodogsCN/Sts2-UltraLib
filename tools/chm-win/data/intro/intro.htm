<div class="info-box">
    <div class="info-title">UltraLib Helper 说明文档</div>
    <div class="info-content">
        欢迎使用 <strong>UltraLib</strong> —— 一个面向 <strong>Slay the Spire 2</strong> 的基础库模组。
        本 CHM 文档是面向 <strong>模组制作者</strong> 与 <strong>贡献者</strong> 的离线参考手册,
        帮助你在不联网的情况下快速查找 UltraLib 提供的功能。
    </div>
</div>

<div class="info-box">
    <div class="info-title">为什么会做这个文档？</div>
    <div class="info-content">
        UltraLib 诞生的原因：作者自己的模组有大量新增功能。为了把 <strong>功能实现</strong> 与
        <strong>游戏内容实现</strong> 拆分开，作者把可复用的功能抽成了这个基础库。
        这样，其他模组或贡献者可以直接使用 UltraLib 提供的功能，而不必重复造轮子。
    </div>
</div>

<p style="FONT-SIZE: 10pt; BORDER-TOP: #ddd 1px solid; COLOR: #666; PADDING-TOP: 10px">
    UltraLib · StS2 基础库 · 作者 Twodogs
</p>
