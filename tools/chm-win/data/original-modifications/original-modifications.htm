    <div class="info-content">
        UltraLib 在提供新增功能的同时，也<b>修改了少量原版逻辑</b>。
        这些修改通常是为了修复原版问题、或让新增功能能够正常工作。
        作为基础库，这些修改会<b>影响所有依赖本库的模组</b>，模组制作者应当了解它们。
    </div>
</div>

</table>

<p style="color:#666; font-size:10pt; border-top:1px solid #ddd; padding-top:10px;">
